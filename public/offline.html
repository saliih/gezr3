<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e2a3a">
    <title>لا يوجد اتصال - GEZR</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e2a3a 0%, #2c3e50 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
        }
        .box { max-width: 380px; }
        img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 1.25rem; }
        h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
        p { color: #c8d6e5; line-height: 1.7; margin: 0 0 1.5rem; }
        button {
            background: #3498db;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: .7rem 1.6rem;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #2b86c5; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/icons/icon-192.png" alt="GEZR">
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تعذّر الوصول إلى الخادم. تحقّق من اتصالك ثم أعد المحاولة.</p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
