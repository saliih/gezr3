services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gezr-laravel
    ports:
      - "8080:80"
    environment:
      APP_NAME: GEZR
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: ""                      # Sera généré automatiquement au 1er démarrage
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gezr
      DB_USERNAME: gezr
      DB_PASSWORD: gezr_pass
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: gezr-db
    environment:
      MARIADB_ROOT_PASSWORD: root_secret
      MARIADB_DATABASE: gezr
      MARIADB_USER: gezr
      MARIADB_PASSWORD: gezr_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
